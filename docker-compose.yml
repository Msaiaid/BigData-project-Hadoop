version: '3.9'

services:

  namenode:
    platform: linux/amd64
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    command: [ "hdfs", "namenode" ]
    ports:
      - "9870:9870"
      - "9000:9000"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-net

  datanode:
    platform: linux/amd64
    image: apache/hadoop:3
    container_name: datanode
    hostname: datanode
    command: [ "hdfs", "datanode" ]
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-net

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    networks:
      - bigdata-net

  hbase-master:
    image: dajobe/hbase:latest
    container_name: hbase-master
    hostname: hbase-master
    ports:
      - "16000:16000"
      - "16010:16010"
      - "2182:2181"
    environment:
      - HBASE_ROOTDIR=hdfs://namenode:9000/hbase
      - HBASE_ZOOKEEPER_QUORUM=zookeeper
    depends_on:
      - namenode
      - datanode
      - zookeeper
    networks:
      - bigdata-net

  hbase-regionserver:
    image: dajobe/hbase:latest
    container_name: hbase-regionserver
    hostname: hbase-regionserver
    ports:
      - "16020:16020"
      - "16030:16030"
    environment:
      - HBASE_ROOTDIR=hdfs://namenode:9000/hbase
      - HBASE_ZOOKEEPER_QUORUM=zookeeper
    depends_on:
      - hbase-master
    networks:
      - bigdata-net

  spark-master:
    image: apache/spark:3.5.1-scala2.12-java11-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    platform: linux/amd64
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MASTER_HOST=spark-master
    volumes:
      - ./data:/data
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:3.5.1-scala2.12-java11-python3-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    platform: linux/amd64
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    volumes:
      - ./data:/data
    networks:
      - bigdata-net

  spark-client:
    image: apache/spark:3.5.1-scala2.12-java11-python3-ubuntu
    container_name: spark-client
    hostname: spark-client
    platform: linux/amd64
    stdin_open: true
    tty: true
    command: /bin/bash
    depends_on:
      - spark-master
    volumes:
      - ./data:/data
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge
